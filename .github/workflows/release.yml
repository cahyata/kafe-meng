name: Rilis Kafe Meng (Tauri)

# Berjalan otomatis setiap kali ada tag versi, misalnya v2.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Pastikan tag sama dengan versi di tauri.conf.json
        shell: bash
        run: |
          CONF="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$CONF" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan versi tauri.conf.json ($CONF)."
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      - name: Build installer, tanda tangani update, unggah ke GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kafe Meng ${{ github.ref_name }}"
          releaseBody: "Unduh file Kafe.Meng_*_x64-setup.exe lalu jalankan."
          releaseDraft: false
          prerelease: false
