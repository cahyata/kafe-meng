<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kafe Meong</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="roam"></div>

  <section id="panel" class="hit" hidden>
    <div class="awning"></div>
    <div class="panel-top">
      <div class="sign">
        <svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true">
          <polygon points="22,40 26,10 46,26" fill="#f4a259"/><polygon points="78,40 74,10 54,26" fill="#f4a259"/>
          <polygon points="29,30 31,17 40,26" fill="#ffb8c8"/><polygon points="71,30 69,17 60,26" fill="#ffb8c8"/>
          <ellipse cx="50" cy="56" rx="34" ry="30" fill="#f4a259"/>
          <path d="M50 28v9M40 30l2 7M60 30l-2 7" stroke="#d9822f" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="38" cy="54" rx="4.5" ry="5.5" fill="#3b2a1a"/><ellipse cx="62" cy="54" rx="4.5" ry="5.5" fill="#3b2a1a"/>
          <polygon points="46,63 54,63 50,68" fill="#ff8fa8"/>
          <ellipse cx="29" cy="64" rx="6" ry="4" fill="#ff9db8" opacity=".6"/><ellipse cx="71" cy="64" rx="6" ry="4" fill="#ff9db8" opacity=".6"/>
        </svg>
        <div><h2>Kafe Meong</h2><span>Buka setiap hari untuk para kucing</span></div>
      </div>
      <button class="btn small" id="closePanel" type="button">Tutup</button>
    </div>
    <div class="chips">
      <span>Tamu senang <b id="chipServed">0</b></span>
      <span>Total koin <b id="chipTotal">0</b></span>
      <span>Belaian <b id="chipPets">0</b></span>
    </div>
    <div class="tabs">
      <button class="tab on" type="button" data-tab="kafe">Kafe</button>
      <button class="tab" type="button" data-tab="ach">Pencapaian <span id="achCount"></span></button>
    </div>
    <div class="panel-body" id="tabKafe">
      <button class="btn fishbtn" id="buyFish" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 12c3-5 9-6 13-2l5-3v10l-5-3c-4 4-10 3-13-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg>Beli 5 ikan <small id="fishCost"></small></button>
      <div class="ups" id="ups"></div>
      <h3>Buku kucing <span id="bookCount"></span></h3>
      <div class="book" id="book"></div>
      <div class="panel-foot">
        <button class="btn small" id="hideHud" type="button">Sembunyikan bar</button>
        <button class="btn small" id="reset" type="button">Mulai dari awal</button>
        <button class="btn small" id="quit" type="button">Keluar</button>
      </div>
    </div>
    <div class="panel-body" id="tabAch" hidden></div>
  </section>

  <div id="hud" class="hit">
    <div class="pill"><small>Koin</small><b id="coins">0</b></div>
    <div class="pill"><small>Ikan</small><b id="fish">0</b></div>
    <div class="pill" title="Tamu yang sedang di kafe dari jatah kursi"><small>Kursi</small><b id="guests">0/2</b></div>
    <button class="btn icon" id="mute" type="button" aria-pressed="false" title="Matikan suara">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path class="on-only" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off-only" d="M15 9l6 6M21 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="btn main" id="togglePanel" type="button">Kafe</button>
    <button class="btn icon" id="collapseHud" type="button" title="Sembunyikan bar (Ctrl+Alt+K)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9.5 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <button id="hudTab" class="hit" type="button" title="Buka bar menu (Ctrl+Alt+K)" aria-label="Buka bar menu" hidden>
    <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true">
      <polygon points="20,42 24,8 48,26" fill="#f4a259" stroke="rgba(40,25,60,.25)" stroke-width="2"/>
      <polygon points="80,42 76,8 52,26" fill="#f4a259" stroke="rgba(40,25,60,.25)" stroke-width="2"/>
      <polygon points="28,32 30,17 41,26" fill="#ffb8c8"/><polygon points="72,32 70,17 59,26" fill="#ffb8c8"/>
      <ellipse cx="50" cy="58" rx="36" ry="31" fill="#f4a259" stroke="rgba(40,25,60,.25)" stroke-width="2"/>
      <path d="M50 29v9M39 31l2 7M61 31l-2 7" stroke="#d9822f" stroke-width="3" stroke-linecap="round"/>
      <g class="logo-eyes"><ellipse cx="37" cy="56" rx="5" ry="6" fill="#3b2a1a"/><ellipse cx="63" cy="56" rx="5" ry="6" fill="#3b2a1a"/>
      <circle cx="38.8" cy="54" r="1.8" fill="#fff"/><circle cx="64.8" cy="54" r="1.8" fill="#fff"/></g>
      <polygon points="45.5,65 54.5,65 50,70 " fill="#ff8fa8"/>
      <path d="M50 70q-4 5-8 2M50 70q4 5 8 2" fill="none" stroke="rgba(40,25,60,.55)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="27" cy="66" rx="6.5" ry="4" fill="#ff9db8" opacity=".6"/><ellipse cx="73" cy="66" rx="6.5" ry="4" fill="#ff9db8" opacity=".6"/>
      <path d="M22 62l-12-3M22 66l-12 3M78 62l12-3M78 66l12 3" stroke="rgba(255,255,255,.8)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="toast" role="status"></div>
  <script src="game.js"></script>
</body>
</html>
